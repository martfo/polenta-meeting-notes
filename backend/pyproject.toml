[project]
name = "meetingnotes"
version = "0.1.0"
description = "Local, private meeting notes backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "spylls>=0.1.7",
    "lancedb>=0.6",
    "pyobjc-framework-Vision>=10.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The transcription and speaker-separation pipeline.
pipeline = [
    "whisperx>=3.1",
    "pyannote.audio>=3.1",
]
# The bge-m3 embedding model for library search.
embeddings = [
    "FlagEmbedding>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetingnotes"]
